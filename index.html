<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./global/style.css" />
    <title>Frontend Mentor | Product preview card component</title>
  </head>

  <body>
    <main class="container">
      <div class="card">
        <div class="image">
          <img
            class="desktop-img"
            src="./images/image-product-desktop.jpg"
            alt="perfume"
          />
          <img
            class="mobile-img"
            src="./images/image-product-mobile.jpg"
            alt="perfume"
          />
        </div>

        <section class="card-info">
          <h2 class="fs-1">Perfume</h2>
          <h1 class="fs-2 perfume_name">Gabrielle Essence Eau De Parfum</h1>
          <p class="fs-3 perfume_description">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="card-price">
            <p class="price fs-2">$149.99</p>
            <p class="old-price fs-4">$169.99</p>
          </div>

          <button class="button fs-5">
            <img
              src="./images/icon-cart.svg"
              alt=""
              height="15"
              width="15"
            />Add to Cart
          </button>
        </section>
      </div>
    </main>
  </body>
</html>
